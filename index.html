<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- 防止搜尋引擎抓取，降低版權風險 -->
  <meta name="robots" content="noindex, nofollow">
  <title>Booster Up English Quiz - 英語學習測驗系統</title>
  <style>
    :root {
      --primary-color: #4A90E2;
      --secondary-color: #5C6AC4;
      --success-color: #2ECC71;
      --error-color: #E74C3C;
      --bg-color: #F4F7F9;
      --card-bg: #FFFFFF;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-color);
      margin: 0;
      padding: 20px;
      color: #333;
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
      background: var(--card-bg);
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }

    h1 {
      text-align: center;
      color: var(--primary-color);
      margin-bottom: 25px;
    }

    .control-panel {
      display: flex;
      gap: 15px;
      margin-bottom: 25px;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
    }

    select, button {
      padding: 10px 15px;
      font-size: 16px;
      border-radius: 6px;
      border: 1px solid #CCC;
      outline: none;
    }

    select {
      background-color: #FFF;
      cursor: pointer;
    }

    button {
      background-color: var(--primary-color);
      color: white;
      border: none;
      cursor: pointer;
      transition: background 0.2s;
    }

    button:hover {
      background-color: var(--secondary-color);
    }

    button:disabled {
      background-color: #BDC3C7;
      cursor: not-allowed;
    }

    .audio-btn {
      background-color: #F39C12;
      padding: 6px 14px;
      font-size: 14px;
      border-radius: 20px;
      margin-left: 10px;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .audio-btn:hover {
      background-color: #D68910;
    }

    .mode-tabs {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-bottom: 20px;
    }

    .tab-btn {
      background-color: #E0E6ED;
      color: #555;
    }

    .tab-btn.active {
      background-color: var(--secondary-color);
      color: white;
    }

    .quiz-card {
      background: #FAFAFA;
      border: 1px solid #EAEAEA;
      padding: 20px;
      border-radius: 8px;
      margin-bottom: 20px;
    }

    .question-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
    }

    .question-prompt {
      font-size: 18px;
      font-weight: bold;
    }

    .options-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
      margin-bottom: 15px;
    }

    .option-btn {
      background: #FFF;
      border: 1px solid #DDD;
      text-align: left;
      padding: 12px 15px;
      color: #333;
      transition: background 0.2s, border-color 0.2s;
    }

    .option-btn:hover {
      background: #EBF3FC;
    }

    .option-btn.selected {
      background: #D6E4FF;
      border-color: var(--primary-color);
      font-weight: bold;
    }

    input[type="text"] {
      width: 100%;
      padding: 12px;
      font-size: 16px;
      border: 1px solid #CCC;
      border-radius: 6px;
      box-sizing: border-box;
      margin-bottom: 15px;
    }

    .nav-buttons {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      margin-top: 10px;
    }

    .nav-buttons button {
      flex: 1;
    }

    .btn-prev {
      background-color: #7F8C8D;
    }

    .btn-prev:hover {
      background-color: #95A5A6;
    }

    .score-board {
      text-align: center;
      font-size: 20px;
      font-weight: bold;
      margin-top: 20px;
      color: var(--secondary-color);
    }

    /* 解答複習卡片樣式 */
    .review-card {
      background: #FFF;
      border: 1px solid #DDD;
      padding: 20px;
      border-radius: 8px;
      margin-top: 25px;
    }

    .sweet-message {
      text-align: center;
      font-size: 22px;
      font-weight: bold;
      color: #E91E63;
      background-color: #FCE4EC;
      padding: 15px;
      border-radius: 8px;
      margin: 15px 0 20px 0;
      border: 2px dashed #F48FB1;
      animation: pulse 1.5s infinite alternate;
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      100% { transform: scale(1.02); }
    }

    .review-item {
      border-bottom: 1px solid #EEE;
      padding: 12px 0;
    }

    .review-item:last-child {
      border-bottom: none;
    }

    .review-item.is-correct {
      border-left: 5px solid var(--success-color);
      padding-left: 10px;
    }

    .review-item.is-wrong {
      border-left: 5px solid var(--error-color);
      padding-left: 10px;
    }

    .review-q {
      font-weight: bold;
      margin-bottom: 5px;
    }

    .review-a {
      font-size: 15px;
      color: #555;
    }

    .badge-correct {
      color: var(--success-color);
      font-weight: bold;
    }

    .badge-wrong {
      color: var(--error-color);
      font-weight: bold;
    }

    .hidden {
      display: none;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>Booster Up English Quiz 測驗系統</h1>

  <!-- 選擇冊數與單元 -->
  <div class="control-panel">
    <select id="bookSelect">
      <option value="book1">Level 1</option>
      <option value="book2">Level 2</option>
      <option value="book3" selected>Level 3</option>
      <option value="book4">Level 4</option>
      <option value="book5">Level 5</option>
    </select>

    <select id="unitSelect">
      <option value="unit1">Unit 1</option>
      <option value="unit2">Unit 2</option>
      <option value="unit3">Unit 3</option>
      <option value="unit4">Unit 4</option>
      <option value="unit5">Unit 5</option>
      <option value="unit6">Unit 6</option>
      <option value="unit7">Unit 7</option>
      <option value="unit8">Unit 8</option>
    </select>

    <button onclick="loadUnitData()">載入單元</button>
  </div>

  <!-- 模式切換 -->
  <div class="mode-tabs">
    <button class="tab-btn active" id="wordsTab" onclick="switchMode('words')">單字練習</button>
    <button class="tab-btn" id="sentencesTab" onclick="switchMode('sentences')">句型練習</button>
  </div>

  <!-- 測驗區域 -->
  <div id="quizArea" class="quiz-card hidden">
    <div class="question-header">
      <div class="question-prompt" id="promptText">題目載入中...</div>
      <!-- 每一題都可以朗讀英文正確發音 -->
      <button id="speakPromptBtn" class="audio-btn" onclick="speakCurrentAnswer()">🔊 聽發音</button>
    </div>
    
    <!-- 填空 / 手寫輸入區域 -->
    <div id="inputArea">
      <input type="text" id="userInput" placeholder="請在此輸入答案..." autocomplete="off">
    </div>

    <!-- 選擇題選項區域 -->
    <div id="optionsArea" class="options-grid hidden"></div>

    <!-- 上一題 / 下一題 控制鈕 -->
    <div class="nav-buttons">
      <button id="prevBtn" class="btn-prev" onclick="prevQuestion()">⬅️ 上一題</button>
      <button id="nextBtn" onclick="nextQuestion()">下一題 ➡️</button>
    </div>
  </div>

  <!-- 進度板 -->
  <div id="scoreBoard" class="score-board hidden">
    目前進度：<span id="currentIndex">0</span> / <span id="totalQuestions">0</span>
  </div>

  <!-- 完測總結與解答檢討區 -->
  <div id="reviewArea" class="review-card hidden">
    <h2 style="text-align: center; color: var(--secondary-color);">🎉 測驗完成！結果統計</h2>
    <div style="text-align: center; font-size: 22px; font-weight: bold;">
      答對題數：<span id="correctCountText" style="color: var(--primary-color);">0</span> / <span id="totalCountText">0</span> 題
    </div>

    <!-- 肉麻讚美 / 鼓勵顯示區 -->
    <div id="sweetMessageArea" class="sweet-message hidden"></div>

    <hr style="border: none; border-top: 1px solid #DDD; margin: 20px 0;">
    <h3>📝 答題檢討與標準解答</h3>
    <div id="reviewList"></div>
    <div style="text-align: center; margin-top: 25px;">
      <button onclick="initQuiz()">🔄 再測驗一次</button>
    </div>
  </div>
</div>

<script>
  let currentBook = 'book3';
  let currentUnit = 'unit1';
  let currentMode = 'words';
  let items = [];
  let currentIndex = 0;
  let userAnswers = [];

  // ❤️ 全對時的肉麻讚美句子庫（每次隨機抽一句）
  const sweetMessages = [
    "💖 Nicole老師超級超級愛你喔！你怎麼會這麼棒啦～",
    "✨ 哇！全對！Nicole老師的心都被你的優秀融化了啦～💕",
    "🥰 太厲害了！全對耶！Nicole老師最喜歡這麼認真又聰明的你了！",
    "💯 答得太完美了！快接受 Nicole 老師的大抱抱跟愛心傳送！愛你喔～❤️",
    "🌟 你是 Nicole 老師的小天才嗎？全對太強了！老師愛死你了啦～😘",
    "👑 全對！Nicole老師要給你頒發「無敵可愛聰明獎」！超級愛你～❤️"
  ];

  // 🤏 差 1~2 題時的溫暖鼓勵語（每次隨機抽一句）
  const closeEncouragementMessages = [
    "🤏 太可惜了！只差一點點就全對囉！Nicole 老師相信你下次一定可以！加油～❤️",
    "🌟 差一點點就滿分全對了！你已經超級優秀了，Nicole 老師為你加油喔！💪",
    "🥰 就差那麼一兩題！ Nicole 老師看好你，再試一次一定能拿全對！"
  ];

  // 💪 答錯 3 題以上的鼓勵語
  const generalEncouragementMessages = [
    "👍 表現得很棒喔！複習一下錯題， Nicole 老師相信你下次一定會進步很多！加油～💪",
    "😊 沒關係，學習就是慢慢累積！Nicole 老師永遠在後面為你加油打氣喔！❤️"
  ];

  // 🔊 語音朗讀功能 (Text-to-Speech)
  function speakText(text) {
    if (!('speechSynthesis' in window)) return;
    window.speechSynthesis.cancel();
    const utterance = new SpeechSynthesisUtterance(text);
    utterance.lang = 'en-US';
    utterance.rate = 0.85;
    window.speechSynthesis.speak(utterance);
  }

  // 朗讀當前題目的標準英文答案
  function speakCurrentAnswer() {
    if (items.length > 0 && currentIndex < items.length) {
      const targetText = items[currentIndex].answer[0];
      speakText(targetText);
    }
  }

  // 1. 動態載入腳本
  function loadUnitData() {
    currentBook = document.getElementById('bookSelect').value;
    currentUnit = document.getElementById('unitSelect').value;
    
    const scriptPath = `data/${currentBook}/${currentUnit}.js`;

    const oldScript = document.getElementById('dynamicUnitScript');
    if (oldScript) oldScript.remove();

    const script = document.createElement('script');
    script.id = 'dynamicUnitScript';
    script.src = scriptPath;
    
    script.onload = () => {
      alert(`已成功載入 ${window.unitData ? window.unitData.unit : '單元資料'}！`);
      initQuiz();
    };

    script.onerror = () => {
      alert(`載入失敗！找不到檔案：${scriptPath}\n請確認檔案是否存在於 data/ 資料夾中。`);
      document.getElementById('quizArea').classList.add('hidden');
      document.getElementById('scoreBoard').classList.add('hidden');
      document.getElementById('reviewArea').classList.add('hidden');
    };

    document.head.appendChild(script);
  }

  // 2. 切換模式
  function switchMode(mode) {
    currentMode = mode;
    document.getElementById('wordsTab').classList.toggle('active', mode === 'words');
    document.getElementById('sentencesTab').classList.toggle('active', mode === 'sentences');
    if (window.unitData) {
      initQuiz();
    }
  }

  // 3. 初始化測驗
  function initQuiz() {
    if (!window.unitData) return;

    items = window.unitData[currentMode] || [];
    currentIndex = 0;
    userAnswers = new Array(items.length).fill(''); // 初始化為空字串陣列

    if (items.length === 0) {
      alert('該分類目前沒有可用的練習題！');
      document.getElementById('quizArea').classList.add('hidden');
      document.getElementById('scoreBoard').classList.add('hidden');
      document.getElementById('reviewArea').classList.add('hidden');
      return;
    }

    document.getElementById('quizArea').classList.remove('hidden');
    document.getElementById('scoreBoard').classList.remove('hidden');
    document.getElementById('reviewArea').classList.add('hidden');
    
    updateScoreBoard();
    showQuestion();
  }

  // 4. 顯示題目（包含還原先前輸入的答案）
  function showQuestion() {
    if (currentIndex >= items.length) {
      finishQuiz();
      return;
    }

    const currentItem = items[currentIndex];
    document.getElementById('promptText').innerText = `Q${currentIndex + 1}. ${currentItem.prompt}`;

    const inputArea = document.getElementById('inputArea');
    const optionsArea = document.getElementById('optionsArea');
    const userInput = document.getElementById('userInput');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');

    // 設定上一題按鈕狀態
    prevBtn.disabled = (currentIndex === 0);

    // 設定下一題按鈕文字（最後一題顯示送出）
    if (currentIndex === items.length - 1) {
      nextBtn.innerText = '完成並送出 🏁';
    } else {
      nextBtn.innerText = '下一題 ➡️';
    }

    // 填空題 vs 選擇題處理
    if (currentItem.type === 'choice' && currentItem.options) {
      inputArea.classList.add('hidden');
      optionsArea.classList.remove('hidden');
      optionsArea.innerHTML = '';

      currentItem.options.forEach(opt => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.innerText = opt;
        
        // 若先前已選過此選項，加亮標示
        if (userAnswers[currentIndex] === opt) {
          btn.classList.add('selected');
        }

        btn.onclick = () => {
          userAnswers[currentIndex] = opt;
          // 清除其他選項樣式並高亮目前選取的
          document.querySelectorAll('.option-btn').forEach(b => b.classList.remove('selected'));
          btn.classList.add('selected');
        };
        optionsArea.appendChild(btn);
      });
    } else {
      inputArea.classList.remove('hidden');
      optionsArea.classList.add('hidden');
      // 還原先前的填空答案
      userInput.value = userAnswers[currentIndex] || '';
    }

    updateScoreBoard();
  }

  // 保存當前題目的答案
  function saveCurrentAnswer() {
    const currentItem = items[currentIndex];
    if (currentItem.type !== 'choice') {
      const userInput = document.getElementById('userInput');
      userAnswers[currentIndex] = userInput.value.trim();
    }
  }

  // 下一題
  function nextQuestion() {
    saveCurrentAnswer();
    currentIndex++;
    showQuestion();
  }

  // 上一題
  function prevQuestion() {
    if (currentIndex > 0) {
      saveCurrentAnswer();
      currentIndex--;
      showQuestion();
    }
  }

  // 6. 完測結算與解答比對（含全對肉麻讚美與差1-2題鼓勵語）
  function finishQuiz() {
    document.getElementById('quizArea').classList.add('hidden');
    document.getElementById('scoreBoard').classList.add('hidden');
    document.getElementById('reviewArea').classList.remove('hidden');

    let correctCount = 0;
    const reviewList = document.getElementById('reviewList');
    reviewList.innerHTML = '';

    items.forEach((item, idx) => {
      const uAns = (userAnswers[idx] || '').trim();
const isCorrect = item.answer.some(a => String(a).trim().toLowerCase() === uAns.toLowerCase());


      if (isCorrect) correctCount++;

      const standardAnswer = item.answer[0];

      const div = document.createElement('div');
      div.className = `review-item ${isCorrect ? 'is-correct' : 'is-wrong'}`;
      div.innerHTML = `
        <div class="review-q">
          Q${idx + 1}. ${item.prompt} 
          <span class="${isCorrect ? 'badge-correct' : 'badge-wrong'}">
            ${isCorrect ? '✓ 正確' : '✗ 錯誤'}
          </span>
        </div>
        <div class="review-a">
          <strong>學生回答：</strong> ${uAns !== '' ? uAns : '(未作答)'}<br>
          <strong>正確答案：</strong> ${standardAnswer}
          <button class="audio-btn" style="padding: 2px 8px; font-size: 12px;" onclick="speakText('${standardAnswer.replace(/'/g, "\\'")}')">🔊 聽發音</button>
        </div>
      `;
      reviewList.appendChild(div);
    });

    // 顯示答對題數與總題數
    const totalQuestions = items.length;
    const wrongCount = totalQuestions - correctCount;

    document.getElementById('correctCountText').innerText = correctCount;
    document.getElementById('totalCountText').innerText = totalQuestions;

    // 肉麻訊息 / 鼓勵語顯示邏輯
    const sweetArea = document.getElementById('sweetMessageArea');
    sweetArea.classList.remove('hidden');

    if (correctCount === totalQuestions) {
      // 💯 1. 全對時：隨機抽肉麻讚美語
      const randomIdx = Math.floor(Math.random() * sweetMessages.length);
      sweetArea.innerText = sweetMessages[randomIdx];
    } else if (wrongCount === 1 || wrongCount === 2) {
      // 🤏 2. 差 1 或 2 題時：給予溫暖鼓勵語
      const randomIdx = Math.floor(Math.random() * closeEncouragementMessages.length);
      sweetArea.innerText = closeEncouragementMessages[randomIdx];
    } else {
      // 💪 3. 差 3 題以上時：給予一般加油語
      const randomIdx = Math.floor(Math.random() * generalEncouragementMessages.length);
      sweetArea.innerText = generalEncouragementMessages[randomIdx];
    }
  }

  // 7. 更新進度板
  function updateScoreBoard() {
    document.getElementById('currentIndex').innerText = Math.min(currentIndex + 1, items.length);
    document.getElementById('totalQuestions').innerText = items.length;
  }

  window.onload = () => {
    loadUnitData();
  };
</script>

</body>
</html>
